<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Grano Zero — aprender café</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F1410" />
<meta name="description" content="PWA para aprender café — ocho preparaciones esenciales, una taza, cero vocabulario críptico." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GranoZero" />
<meta name="mobile-web-app-capable" content="yes" />
<meta property="og:title" content="GranoZero — aprender café" />
<meta property="og:description" content="PWA educativa sobre café: del origen al sorbo." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600;1,700&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="sections.css" />

<style>
/* ────── TOKENS ───────────────────────────────────────────────────────────── */
:root{
  --gz-ink: #1F1410;
  --gz-coffee: #3A2418;
  --gz-coffee-light: #5C3A1F;
  --gz-coffee-30: rgba(58,36,24,.30);
  --gz-gold: #C8881F;
  --gz-gold-soft: #D6A24A;
  --gz-paper: #F1EAD8;
  --gz-paper-warm: #F8F2E4;
  --gz-cream: #EFE6D2;
  --gz-breathe-speed: 1;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --brand: "Cormorant Garamond", "Cormorant", "Times New Roman", serif;
  --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, monospace;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--gz-ink); color:var(--gz-paper); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
html{ overflow-x:hidden; width:100%; }
body{ overflow-x:hidden; width:100%; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
em{ font-style:italic; }
:focus-visible{ outline:2px solid var(--gz-gold); outline-offset:3px; border-radius:4px; }

/* ────── TEXTURA DE PAPEL SUTIL ───────────────────────────────────────────── */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background-image:
    radial-gradient(rgba(200,136,31,.07) 1px, transparent 1px),
    radial-gradient(rgba(241,234,216,.05) 1px, transparent 1px);
  background-size: 22px 22px, 13px 13px;
  background-position: 0 0, 7px 7px;
  opacity:.6;
  mix-blend-mode:overlay;
}

/* ────── KEYFRAMES ────────────────────────────────────────────────────────── */
@keyframes gz-draw { to { stroke-dashoffset:0; } }
@keyframes gz-breathe {
  0%,100% { transform: var(--breathe-base, none) scale(1); }
  50%     { transform: var(--breathe-base, none) scale(1.07); }
}
@keyframes gz-steam {
  0%   { opacity:0; transform: translateY(0) scaleX(1); }
  20%  { opacity:.9; }
  60%  { opacity:.7; transform: translateY(-30px) scaleX(1.1); }
  100% { opacity:0; transform: translateY(-80px) scaleX(.7); }
}
@keyframes gz-fade-up {
  from { opacity:.001; transform: translateY(24px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes gz-rise {
  from { transform: translateY(18px); }
  to   { transform: translateY(0); }
}
@keyframes gz-card-in {
  from { opacity:.001; transform: translateY(40px) rotate(-2deg); }
  to   { opacity:1; transform: translateY(0) rotate(0); }
}
@keyframes gz-spin { to { transform: rotate(360deg); } }
@keyframes gz-pulse-dot {
  0%,100% { transform: scale(1); opacity:1; }
  50%     { transform: scale(1.5); opacity:.5; }
}

/* ────── SPLASH ───────────────────────────────────────────────────────────── */
.gz-splash{
  position:fixed; inset:0; z-index:1000;
  background: radial-gradient(ellipse at 50% 40%, #2a1810 0%, #0e0907 75%);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  transition: opacity .7s ease;
}
.gz-splash-p2{ opacity:0; pointer-events:none; }
.gz-splash-frame{
  display:flex; flex-direction:column; align-items:center; gap:24px;
  position:relative; z-index:2;
}
.gz-splash-bean{
  width: 120px; height:auto;
  opacity:0; transform: scale(.6);
  animation: gz-splash-bean-in 1.1s cubic-bezier(.5,.1,.3,1) .15s forwards,
             gz-breathe 2400ms ease-in-out 1.3s infinite;
  filter: drop-shadow(0 8px 24px rgba(200,136,31,.35));
}
@keyframes gz-splash-bean-in {
  0%   { opacity:0; transform: scale(.5) rotate(-30deg); }
  60%  { opacity:1; transform: scale(1.05) rotate(0deg); }
  100% { opacity:1; transform: scale(1) rotate(0deg); }
}
.gz-splash-wordmark{
  font-family:var(--brand); color:var(--gz-paper);
  font-size: 88px; line-height:.9; letter-spacing:-.005em;
  display:flex; align-items:baseline;
  opacity:0; transform: translateY(8px);
}
.gz-splash-p1 .gz-splash-wordmark, .gz-splash-p2 .gz-splash-wordmark{
  animation: gz-rise-in .8s cubic-bezier(.4,.1,.3,1) forwards;
}
@keyframes gz-rise-in {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}
.gz-splash-grano{ font-weight:500; }
.gz-splash-zero{ color:var(--gz-gold); font-weight:600; font-style:italic; letter-spacing:-.01em; margin-left:2px; }

.gz-splash-tagline{
  font-family:var(--mono); font-size:11px; letter-spacing:.3em; text-transform:uppercase;
  color: rgba(241,234,216,.55);
  display:flex; align-items:center; gap:14px;
  opacity:0;
}
.gz-splash-p1 .gz-splash-tagline, .gz-splash-p2 .gz-splash-tagline{
  animation: gz-rise-in .8s ease .2s forwards;
}
.gz-splash-tagline::before, .gz-splash-tagline::after{
  content:""; width:6px; height:6px; border-radius:50%; background: var(--gz-gold);
  animation: gz-pulse-dot 1.4s ease-in-out infinite;
}
.gz-splash-tagline::after{ animation-delay:.7s; }

.gz-curtain{
  position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse at 50% 50%, transparent 0%, rgba(31,20,16,.6) 70%, var(--gz-ink) 100%);
  opacity:0; transition: opacity .7s ease;
}
.gz-splash-p2 .gz-curtain{ opacity:1; }

/* ────── HEADER ───────────────────────────────────────────────────────────── */
.gz-header{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; justify-content:space-between;
  align-items:center; gap: 32px;
  padding: 22px 32px;
  opacity:0; transform: translateY(-12px); pointer-events:none;
  transition: opacity .8s ease .3s, transform .8s ease .3s, padding .3s ease, background .3s ease;
  background: linear-gradient(180deg, rgba(31,20,16,.75) 0%, rgba(31,20,16,.4) 70%, transparent 100%);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
}
.gz-header.is-visible{ opacity:1; transform: translateY(0); pointer-events:auto; }
.gz-header.is-scrolled{
  padding: 14px 32px;
  background: rgba(14,9,7,.88);
  border-bottom: 1px solid rgba(241,234,216,.08);
}

.gz-logo{
  display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--gz-paper);
  font-family:var(--brand); font-size:26px; line-height:1; letter-spacing:-.01em;
}
.gz-logo-bean{ width:34px; height:auto; animation: gz-breathe calc(3500ms / var(--gz-breathe-speed)) ease-in-out infinite; transition: transform .3s ease; }
.gz-logo:hover .gz-logo-bean{ transform: rotate(-12deg) scale(1.08); }
.gz-logo-text{ display:inline-flex; align-items:baseline; }
.gz-logo-text-grano{ font-weight:500; }
.gz-logo-text em{ color:var(--gz-gold); font-style:italic; font-weight:600; }

.gz-nav{ display:none; }

.gz-controls{ display:flex; align-items:center; gap:14px; }
.gz-header-cata-btn{
  display:inline-flex; align-items:center; gap:8px;
  padding: 10px 18px; border-radius:999px;
  font-family: var(--sans); font-size:13px; font-weight:600;
  border: 1px solid var(--gz-gold);
  color: var(--gz-gold);
  white-space: nowrap;
  transition: all .25s ease;
}
.gz-header-cata-btn:hover{ background: var(--gz-gold); color: var(--gz-ink); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(200,136,31,.3); }
.gz-icon-btn{
  width:36px; height:36px; border-radius:50%;
  display:grid; place-items:center;
  background: rgba(241,234,216,.06);
  border: 1px solid rgba(241,234,216,.12);
  color: var(--gz-paper);
  transition: all .2s ease;
}
.gz-icon-btn:hover{ background: rgba(200,136,31,.18); border-color: var(--gz-gold); color: var(--gz-gold); }
.gz-icon-btn.is-active{ color: var(--gz-gold); border-color: rgba(200,136,31,.5); background: rgba(200,136,31,.08); }

@media (max-width: 720px){
  .gz-header{ padding: 14px 18px; gap: 14px; }
  .gz-header.is-scrolled{ padding: 12px 18px; }
  .gz-header-cata-btn{ padding: 8px 12px; font-size:11px; }
  .gz-logo-text{ font-size:18px; }
}

/* Celulares angostos (~360-390px): el header (logo + pill + 2 iconos) no
   entra con las medidas de arriba y el botón de sonido queda pegado/cortado
   al borde derecho. Se comprime todo un poco más para que respire. */
@media (max-width: 400px){
  .gz-header{ padding: 12px 12px; gap: 8px; }
  .gz-header.is-scrolled{ padding: 10px 12px; }
  .gz-logo-text{ font-size:15px; }
  .gz-logo-bean{ width:28px; }
  .gz-controls{ gap:6px; }
  .gz-header-cata-btn{ padding: 6px 9px; font-size:10px; }
  .gz-icon-btn{ width:32px; height:32px; }
}

/* ────── HOME ─────────────────────────────────────────────────────────────── */
.gz-main{ position:relative; z-index:2; }
.gz-home{
  padding: 96px 32px 0;
  position:relative;
  background: radial-gradient(ellipse at 80% 0%, rgba(200,136,31,.10), transparent 50%),
              radial-gradient(ellipse at 0% 100%, rgba(124,74,32,.18), transparent 60%),
              var(--gz-ink);
}
.gz-home-grid{
  max-width: 1240px; margin: 0 auto;
  display:grid; grid-template-columns: minmax(0,1.05fr) minmax(0,1fr); gap: 56px;
  align-items: center; min-height: min(640px, calc(100vh - 260px));
  padding-bottom: 24px;
}

/* Mesa de madera maciza: apoyo de la taza y, a la vez, el borde/separador
   entre el hero y Origen — por eso es full-bleed y pegada al fondo. */
.gz-hero-table{
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 100px;
  z-index: 3;
  pointer-events: none;
  background-color: #5c3a22;
  background-image:
    /* vetas finas, casi horizontales, con un poquito de irregularidad */
    repeating-linear-gradient(179deg,
      rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px,
      transparent 1px, transparent 5px
    ),
    repeating-linear-gradient(182deg,
      rgba(255,215,175,.055) 0px, rgba(255,215,175,.055) 1px,
      transparent 1px, transparent 9px
    ),
    repeating-linear-gradient(177deg,
      rgba(0,0,0,.06) 0px, rgba(0,0,0,.06) 2px,
      transparent 2px, transparent 21px
    ),
    /* costuras de los tablones de la mesa maciza */
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 2px,
      transparent 2px, transparent 340px
    ),
    /* un par de nudos de la madera */
    radial-gradient(ellipse 46px 9px at 16% 32%, rgba(0,0,0,.22), transparent 72%),
    radial-gradient(ellipse 36px 7px at 69% 68%, rgba(0,0,0,.18), transparent 72%),
    radial-gradient(ellipse 40px 8px at 89% 28%, rgba(0,0,0,.16), transparent 72%);
  border-top: 2px solid rgba(255,197,130,.3);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.07), inset 0 -16px 22px rgba(0,0,0,.4), 0 -10px 24px rgba(0,0,0,.5);
}

.gz-home-text{ animation: gz-rise 1s ease .2s both; }

.gz-headline{
  font-family:var(--brand); font-weight:500;
  font-size: clamp(44px, 6.2vw, 92px);
  line-height: .98; margin: 0 0 26px;
  letter-spacing:-.02em;
  text-wrap: balance;
}
.gz-headline em{ color: var(--gz-gold); font-style: italic; }

.gz-sub{
  font-size: clamp(16px, 1.4vw, 19px);
  line-height: 1.55; max-width: 460px;
  color: rgba(241,234,216,.72);
  margin: 0 0 40px;
}

.gz-cta-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom: 0; }
.gz-cta{
  display:inline-flex; align-items:center; gap:10px;
  padding: 16px 24px; border-radius: 999px;
  font-family:var(--sans); font-size:14px; font-weight:500;
  letter-spacing:.02em;
  transition: all .25s ease;
}
.gz-cta-primary{
  background: var(--gz-paper); color: var(--gz-ink);
}
.gz-cta-primary:hover{ background: var(--gz-gold); color: var(--gz-ink); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(200,136,31,.3); }
.gz-cta-arrow{ transition: transform .25s; }
.gz-cta-primary:hover .gz-cta-arrow{ transform: translateX(4px); }
.gz-cta-ghost{
  color: var(--gz-paper);
  border: 1px solid rgba(241,234,216,.25);
}
.gz-cta-ghost:hover{ border-color: var(--gz-gold); color: var(--gz-gold); }

/* CENTERPIECE — foto real del espresso */
.gz-stage-photo{
  position:relative; width: 78%; max-width: 460px;
  aspect-ratio: 4/5;
  border-radius: 18px;
  overflow:hidden;
  background: #F1EAD8;
  box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(200,136,31,.18);
  z-index:2;
}
.gz-stage-photo::after{
  content:""; position:absolute; inset:0;
  background: radial-gradient(ellipse at 50% 110%, rgba(200,136,31,.18), transparent 50%),
              linear-gradient(180deg, rgba(31,20,16,0) 60%, rgba(31,20,16,.15) 100%);
  pointer-events:none;
}
.gz-stage-photo img{
  width:100%; height:100%; object-fit:cover; display:block;
}
.gz-stage-photo-corner{
  position:absolute; top:14px; left:14px; z-index:2;
  display:inline-flex; align-items:center; gap:8px;
  padding: 6px 12px; border-radius:999px;
  background: rgba(31,20,16,.62);
  backdrop-filter: blur(6px);
  font-family:var(--mono); font-size:9px; letter-spacing:.24em; text-transform:uppercase;
  color: var(--gz-paper);
}
.gz-stage-photo-corner span:first-child{ width:5px; height:5px; border-radius:50%; background: var(--gz-gold); }
.gz-stage{
  position:relative; display:flex; align-items:flex-end; justify-content:center;
  min-height: 560px;
  padding-bottom: 106px;
  animation: gz-rise 1.2s ease .5s both;
}
.gz-stage-cupwrap{
  position:relative; width:70%; max-width:420px; z-index:2;
}
.gz-stage-cupwrap::after{
  content:""; position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
  width:56%; height:20px;
  background: radial-gradient(ellipse, rgba(0,0,0,.5), transparent 72%);
  pointer-events:none;
}
.gz-stage-steam{
  position:absolute; left:50%; bottom:60%; transform: translateX(-50%);
  z-index:1; pointer-events:none; mix-blend-mode: screen;
}
.gz-stage-cup{
  position:relative; z-index:2; width: 100%; display:block;
  filter: drop-shadow(0 20px 30px rgba(0,0,0,.4));
}
.gz-stage-deco{
  position:absolute; inset:0;
  pointer-events:none;
}
.gz-stage-bean{
  position:absolute;
  transform: var(--breathe-base, none);
  transform-origin:center;
  filter: drop-shadow(0 6px 16px rgba(0,0,0,.55));
  z-index: 1;
}
.gz-crema-swirl{
  stroke-dasharray: 200;
  animation: gz-crema-swirl 6s ease-in-out infinite;
}
@keyframes gz-crema-swirl {
  0%,100% { stroke-dashoffset: 0; opacity:.7; }
  50%     { stroke-dashoffset: -40; opacity:.9; }
}

@media (max-width: 1080px){
  .gz-home-grid{ grid-template-columns: minmax(0,1fr); gap: 32px; min-height: 0; padding-bottom: 0; align-items: start; }
  .gz-stage{ min-height: 460px; padding-bottom: 77px; }
  .gz-stage-cupwrap{ width: 64%; max-width: 360px; }
  .gz-stage-deco{ display: none; }
  .gz-hero-table{ height: 72px; }
}
@media (max-width: 600px){
  .gz-stage{ min-height: 340px; padding-bottom: 27px; z-index: 100; }
  .gz-stage-cupwrap{ width: 76%; max-width: 280px; }
  .gz-headline{ font-size: clamp(34px, 9vw, 48px); }
  .gz-hero-table{ height: 60px; }
}

/* ────── CATÁLOGO ─────────────────────────────────────────────────────────── */
.gz-catalog{
  padding: 120px 28px 80px;
  max-width: 1320px; margin: 0 auto;
  position:relative;
}
.gz-catalog-head{
  max-width: 720px; margin-bottom: 64px;
}
.gz-section-num{
  font-family:var(--mono); font-size:11px; letter-spacing:.26em; text-transform:uppercase;
  color: var(--gz-gold); margin-bottom: 20px;
}
.gz-catalog-title{
  font-family:var(--brand); font-weight:500;
  font-size: clamp(40px, 5.2vw, 72px); line-height:.98;
  margin: 0 0 18px; letter-spacing:-.015em;
}
.gz-catalog-title em{ font-weight:600; font-style:italic; }
.gz-catalog-title em{ color: var(--gz-gold); }
.gz-catalog-sub{
  font-size: 17px; line-height: 1.55;
  color: rgba(241,234,216,.65); max-width: 520px; margin: 0;
}

.gz-grid{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 28px;
}

.gz-card{
  position:relative; text-align:left;
  background: var(--gz-paper);
  color: var(--gz-coffee);
  border-radius: 28px;
  padding: 24px 22px 22px;
  overflow:hidden;
  cursor: pointer;
  transition: transform .35s cubic-bezier(.4,.1,.3,1), box-shadow .35s ease;
  animation: gz-rise .7s cubic-bezier(.5,.1,.3,1) both;
  display:flex; flex-direction:column; gap:10px;
  min-height: 360px;
}
.gz-card::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(circle at 20% 0%, var(--cafe-color) 0%, transparent 35%);
  opacity:.08; transition: opacity .35s;
}
.gz-card:hover{
  transform: translateY(-8px);
  box-shadow: 0 24px 50px rgba(0,0,0,.4), 0 0 0 1px var(--gz-gold);
}
.gz-card:hover::before{ opacity:.16; }

.gz-card-num{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  color: var(--gz-gold); margin-bottom: 4px;
}

.gz-card-stage{
  position:relative; width:100%; aspect-ratio: 4/5;
  display:flex; align-items:center; justify-content:center;
  margin: 4px 0 14px;
  border-radius: 16px;
  overflow:hidden;
  background: #EBE0C6;
}
.gz-card-stage img.gz-card-photo{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  transition: transform .5s ease;
}
.gz-card:hover .gz-card-photo{ transform: scale(1.04); }
.gz-card-stage::after{
  content:""; position:absolute; inset:0;
  background: linear-gradient(180deg, transparent 60%, rgba(58,36,24,.10) 100%);
  pointer-events:none;
}
.gz-card-stage svg{ width: 78%; height: auto; transition: transform .4s ease; }
.gz-card:hover .gz-card-stage svg{ transform: translateY(-4px); }
.gz-card-steam{
  position:absolute; top: 6%; left:50%; transform: translateX(-50%);
  opacity:0; transition: opacity .3s ease;
}
.gz-card-steam.is-on{ opacity:1; }
.gz-card-bean{
  position:absolute; top: 14%; right: 14%;
  opacity:0; transform: scale(.7);
  transition: opacity .35s, transform .35s;
}
.gz-card:hover .gz-card-bean{ opacity:1; transform: scale(1) rotate(0); }

.gz-card-title{
  font-family:var(--brand); font-weight:500;
  font-size: 30px; line-height:1; margin:0 0 4px;
  letter-spacing:-.015em;
}
.gz-card-title em{ font-size: .5em; color: var(--gz-gold); font-style:italic; font-weight:600; letter-spacing:0; display:block; margin-top:6px; }
.gz-card-tag{
  font-size: 13px; line-height:1.45;
  color: rgba(58,36,24,.65); margin:0;
  flex-grow: 1;
}
.gz-card-footer{
  display:flex; align-items:flex-end; justify-content:space-between;
  margin-top: 8px; padding-top: 14px;
  border-top: 1px dashed rgba(58,36,24,.2);
  gap: 12px;
}
.gz-card-intensity{ display:flex; flex-direction:column; gap: 6px; }
.gz-card-intensity-label{
  font-family:var(--mono); font-size:9px; letter-spacing:.22em; text-transform:uppercase;
  color: rgba(58,36,24,.55);
}
.gz-intensity-row{ display:inline-flex; gap:4px; align-items:center; }
.gz-intensity-bean{ width: 12px; height:auto; opacity:.18; transition: opacity .25s, transform .25s; }
.gz-intensity-bean.is-on{ opacity:1; }
.gz-card:hover .gz-intensity-bean.is-on{ transform: translateY(-1px); }
.gz-card-arrow{
  font-size: 18px; transition: transform .25s;
  color: var(--gz-coffee);
}
.gz-card:hover .gz-card-arrow{ transform: translateX(4px); color: var(--gz-gold); }

/* ────── SHEET DETAIL ─────────────────────────────────────────────────────── */
.gz-sheet-wrap{
  position:fixed; inset:0; z-index:100;
  background: rgba(14,9,7,.65);
  backdrop-filter: blur(6px);
  display:flex; align-items:flex-end; justify-content:center;
  padding: 20px;
  animation: gz-fade-up .35s ease both;
}
.gz-sheet{
  position:relative;
  width: 100%; max-width: 1080px;
  max-height: 92vh;
  background: linear-gradient(160deg, var(--gz-coffee) 0%, var(--gz-ink) 100%);
  color: var(--gz-paper);
  border-radius: 32px 32px 8px 8px;
  border-top: 1px solid rgba(200,136,31,.4);
  padding: 28px 32px 32px;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 24px;
  animation: gz-sheet-in .5s cubic-bezier(.5,.1,.3,1) both;
}
@keyframes gz-sheet-in {
  from { transform: translateY(40px); opacity:0; }
  to   { transform: translateY(0); opacity:1; }
}
.gz-sheet::before{
  content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, transparent 0%, var(--cafe-color, var(--gz-gold)) 35%, var(--gz-gold) 50%, var(--cafe-color, var(--gz-gold)) 65%, transparent 100%);
}
.gz-sheet-close{
  position:absolute; top: 20px; right: 24px; z-index:2;
  width: 38px; height: 38px; border-radius:50%;
  background: rgba(241,234,216,.08); border: 1px solid rgba(241,234,216,.15);
  color: var(--gz-paper); font-size: 22px; line-height:1;
  transition: all .2s;
}
.gz-sheet-close:hover{ background: var(--gz-gold); color: var(--gz-ink); border-color: var(--gz-gold); }

.gz-sheet-head{ grid-column: 1 / -1; max-width: 640px; display: none; }
.gz-sheet-title{
  font-family:var(--brand); font-weight:500;
  font-size: clamp(40px, 5.4vw, 68px); line-height:.95;
  margin: 0 0 14px; letter-spacing:-.015em;
}
.gz-sheet-title em{ color: var(--gz-gold); font-size:.55em; font-weight:600; font-style:italic; display:block; margin-top:6px; }
.gz-sheet-blurb{
  font-size: 17px; line-height: 1.55;
  color: rgba(241,234,216,.75); margin: 0;
  max-width: 540px;
}

.gz-sheet-body{
  display:grid; grid-template-columns: 1.5fr 1fr; gap: 32px;
  align-items: start;
}
.gz-sheet-body > .gz-sheet-stats{ grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; gap: 18px; }
.gz-sheet-body > .gz-sheet-stats .gz-statbar{ flex: 1 1 200px; }
.gz-sheet-body > .gz-sheet-notes{ grid-column: 1 / -1; }
.gz-sheet-stats{ display:flex; flex-direction:column; gap: 14px; }
.gz-statbar{ display:flex; flex-direction:column; gap:6px; }
.gz-statbar-head{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size: 11px; letter-spacing:.18em; text-transform:uppercase;
  color: rgba(241,234,216,.7);
}
.gz-statbar-val{ color: var(--gz-gold); }

.gz-sheet-label{
  font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color: var(--gz-gold); margin-bottom: 12px;
}
.gz-chips{ display:flex; flex-wrap:wrap; gap: 8px; }
.gz-chip{
  padding: 8px 14px; border-radius: 999px;
  background: rgba(241,234,216,.08);
  border: 1px solid rgba(241,234,216,.16);
  font-size: 13px; color: var(--gz-paper);
}

.gz-sheet-recipe ol{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
.gz-sheet-recipe li{
  display:flex; align-items:flex-start; gap: 12px;
  padding: 12px 14px;
  background: rgba(241,234,216,.04);
  border-left: 2px solid var(--gz-gold);
  border-radius: 0 8px 8px 0;
  font-size: 14px; line-height: 1.5;
}
.gz-step-num{
  font-family:var(--serif); color: var(--gz-gold); font-size:20px; line-height:1;
  flex-shrink:0; min-width: 18px;
}

.gz-sheet-data{
  display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  padding: 18px; border: 1px solid rgba(241,234,216,.12);
  border-radius: 16px;
  background: rgba(0,0,0,.18);
}
.gz-datacell{ display:flex; flex-direction:column; gap:4px; }
.gz-datacell-label{
  font-family:var(--mono); font-size:10px; letter-spacing:.22em; text-transform:uppercase;
  color: rgba(241,234,216,.55);
}
.gz-datacell-value{
  font-family:var(--serif); font-size: 24px; font-weight:400; line-height:1;
  color: var(--gz-paper);
}

.gz-sheet-hero{
  display:flex; align-items:flex-start; justify-content:center;
  padding-top: 12px;
  position: sticky; top: 0;
}
.gz-sheet-hero svg{
  filter: drop-shadow(0 12px 30px rgba(200,136,31,.25));
  animation: gz-breathe calc(3800ms / var(--gz-breathe-speed)) ease-in-out infinite;
}

@media (max-width: 820px){
  .gz-sheet{ padding: 22px 18px 24px; max-height: 94vh; border-radius: 24px 24px 8px 8px; gap: 18px; }
  .gz-sheet-body{ grid-template-columns: minmax(0,1fr); gap: 24px; }
  .gz-sheet-hero-art{ aspect-ratio: 4/3; }
}

/* ────── FOOTER (editorial) ────────────────────────────────────────────── */
.gz-footer{
  position: relative;
  margin-top: 80px;
  padding: 60px 32px 0;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(124,74,32,.18), transparent 50%),
    radial-gradient(ellipse at 100% 0%, rgba(200,136,31,.08), transparent 50%),
    linear-gradient(180deg, var(--gz-ink) 0%, #0c0805 100%);
  border-top: 1px solid rgba(241,234,216,.08);
  font-family: var(--sans);
  font-size: 14px; line-height: 1.55;
  color: rgba(241,234,216,.7);
  overflow: hidden;
}
.gz-footer-wordmark{
  position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);
  font-family: var(--brand);
  font-size: clamp(140px, 22vw, 320px);
  line-height: 1; letter-spacing: -.02em;
  white-space: nowrap;
  color: transparent;
  -webkit-text-stroke: 1px rgba(200,136,31,.18);
  pointer-events: none;
  user-select: none;
  display: flex; align-items: baseline;
}
.gz-footer-wordmark span{ font-weight: 500; }
.gz-footer-wordmark em{ font-weight: 600; font-style: italic; -webkit-text-stroke: 1px rgba(200,136,31,.4); }
.gz-footer-grid{
  position: relative; z-index: 2;
  max-width: 1320px; margin: 0 auto;
  display: grid; grid-template-columns: 1.4fr 1fr 1.2fr;
  gap: 48px;
  padding-bottom: 60px;
  border-bottom: 1px dashed rgba(241,234,216,.12);
}
.gz-footer-col{ display: flex; flex-direction: column; gap: 14px; }
.gz-footer-col-brand{ max-width: 320px; }
.gz-footer-bean{ width: 40px; height: auto; opacity: .9; margin-bottom: 4px; }
.gz-footer-tagline{
  font-family: var(--brand); font-weight: 500;
  font-size: 24px; line-height: 1.1; letter-spacing: -.01em;
  color: var(--gz-paper); margin: 0;
}
.gz-footer-tagline em{ font-style: italic; font-weight: 600; color: var(--gz-gold); }
.gz-footer-desc{ font-size: 13px; color: rgba(241,234,216,.55); margin: 0; }
.gz-footer-coltitle{
  font-family: var(--mono); font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
  color: var(--gz-gold); margin-bottom: 6px;
}
.gz-footer-nav{
  list-style: none; padding: 0; margin: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px;
}
.gz-footer-nav button{
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--sans); font-size: 13.5px;
  color: rgba(241,234,216,.6);
  padding: 4px 0; cursor: pointer;
  transition: color .2s, transform .2s;
  text-align: left;
}
.gz-footer-nav button:hover{ color: var(--gz-gold); transform: translateX(3px); }
.gz-footer-nav-n{
  font-family: var(--mono); font-size: 9px; letter-spacing: .2em;
  color: rgba(241,234,216,.35); width: 18px;
}
.gz-footer-nav button:hover .gz-footer-nav-n{ color: var(--gz-gold); }
.gz-footer-dl{ margin: 0; }
.gz-footer-dl > div{
  display: grid; grid-template-columns: 110px 1fr;
  gap: 12px; padding: 8px 0;
  border-bottom: 1px dashed rgba(241,234,216,.08);
}
.gz-footer-dl > div:last-child{ border-bottom: 0; }
.gz-footer-dl dt{
  font-family: var(--mono); font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
  color: rgba(241,234,216,.5); margin: 0;
}
.gz-footer-dl dd{
  font-size: 13px; color: rgba(241,234,216,.78); margin: 0;
  font-family: var(--brand); font-weight: 500; letter-spacing: -.005em;
}
.gz-footer-col-meta{ position: relative; }
.gz-footer-quote{
  font-family: var(--brand); font-style: italic;
  font-size: 17px; line-height: 1.35;
  color: var(--gz-paper); margin: 0 0 18px;
  position: relative;
}
.gz-footer-mark{
  position: absolute; top: -14px; left: -4px;
  font-size: 48px; line-height: 1;
  color: var(--gz-gold); opacity: .4;
}
.gz-footer-meta-row{
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 14px;
  border-top: 1px solid rgba(241,234,216,.08);
  font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
  color: rgba(241,234,216,.5);
}
.gz-footer-version{ color: var(--gz-gold); }
.gz-footer-bottom{
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  gap: 18px;
  padding: 22px 0 28px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
  color: rgba(241,234,216,.4);
}
.gz-footer-bottom-line{
  flex: 1; max-width: 80px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,136,31,.5), transparent);
}
@media (max-width: 980px){
  .gz-footer-grid{ grid-template-columns: 1fr 1fr; gap: 32px; }
  .gz-footer-col-brand{ grid-column: 1 / -1; max-width: 100%; }
  .gz-footer-wordmark{ font-size: 24vw; bottom: -10px; }
}
@media (max-width: 600px){
  .gz-footer{ padding: 40px 20px 0; }
  .gz-footer-grid{ grid-template-columns: 1fr; gap: 28px; padding-bottom: 40px; }
  .gz-footer-bottom{ font-size: 8.5px; }
}
</style>
</head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
